<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gestión · Royal Essence</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1d1a16;--mu:#7a7266;--ac:#a8812f;--bd:#e6dfd2}
@media(prefers-color-scheme:dark){:root{--bg:#15130f;--card:#201d17;--tx:#f1ece2;--mu:#a39a8a;--ac:#d4a84b;--bd:#37321f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
h1{font:600 22px Georgia,serif;color:var(--ac);text-align:center;margin:16px 0 4px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer}
button.p,nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:960px;margin:auto;padding:8px 12px 60px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}.pr{color:var(--ac);font-weight:700}.m{color:var(--mu)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;max-width:420px;width:92%}pre{white-space:pre-wrap;font:13px monospace}
</style></head><body>
<h1>ROYAL ESSENCE · GESTIÓN</h1><nav id="nav"></nav><main id="m"></main><dialog id="d"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://mkchtybakuwekjfycnia.supabase.co",SB_KEY="TU_ANON_KEY";
const SOCIOS=["Tiago","Joaquin","Cuenta del negocio"],PERS=["Tiago","Joaquin"],MED=["Efectivo","Transferencia"],sb=supabase.createClient(SB_URL,SB_KEY);
let P=[],V=[],O=[],C=[],K=[],D=[],tab="stock",edit=null;
const $=s=>document.querySelector(s),$$=(s,f)=>document.querySelectorAll(s).forEach(f);
const money=n=>"$"+Number(n||0).toLocaleString("es-AR"),pid=i=>P.find(p=>p.id===i),fd=s=>(s||"").slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt=(l,s)=>l.map(x=>`<option ${x===s?"selected":""}>${x}</option>`).join("");
const sum=(l,f)=>l.reduce((s,x)=>s+f(x),0),vt=v=>v.cantidad*v.precio,ct=k=>k.cantidad*k.costo;
async function save(t,id,o){const r=id?await sb.from(t).update(o).eq("id",id):await sb.from(t).insert(o);if(r.error){alert("Error: "+r.error.message);return false}edit=null;await load();return true}
async function del(t,id,m){if(confirm(m||"¿Eliminar?")){await sb.from(t).delete().eq("id",id);load()}}
function wire(t){$$("[data-e]",b=>b.onclick=()=>{edit=b.dataset.e;render();scrollTo(0,0)});$$("[data-d]",b=>b.onclick=()=>del(t,b.dataset.d));const x=$("#cx");if(x)x.onclick=()=>{edit=null;render()}}
(async()=>{const{data:{session}}=await sb.auth.getSession();session?start():login()})();
function login(msg){
 $("#nav").innerHTML="";$("#m").innerHTML=`<form id="f" style="max-width:320px;margin:30px auto;grid-template-columns:1fr"><input name="e" type="email" placeholder="Email" required><input name="p" type="password" placeholder="Contraseña" required><button class="p">Ingresar</button><div class="m">${msg||""}</div></form>`;
 $("#f").onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?login("Email o contraseña incorrectos"):start()};
}
async function start(){const{data:ok}=await sb.rpc("es_socio");if(!ok){await sb.auth.signOut();return login("Esta cuenta no tiene acceso.")}await load()}
async function load(){
 const q=(t,o)=>sb.from(t).select("*").order(o,{ascending:o!=="fecha"});
 const r=await Promise.all([q("productos","nombre"),q("ventas","fecha"),q("pedidos","fecha"),q("clientes","nombre"),q("compras","fecha"),q("depositos","fecha")]);
 [P,V,O,C,K,D]=r.map(x=>x.data||[]);const bad=r.find(x=>x.error);if(bad)alert("Falta correr schema_update.sql en Supabase: "+bad.error.message);render();
}
function render(){
 const T=[["stock","Stock"],["clientes","Clientes"],["ventas","Ventas"],["compras","Compras"],["ped","Pedidos ("+O.filter(o=>o.estado==="Pendiente").length+")"],["dinero","Dinero"]];
 $("#nav").innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")+`<button id="out">Salir</button>`;
 $$("#nav [data-t]",b=>b.onclick=()=>{tab=b.dataset.t;edit=null;render()});$("#out").onclick=async()=>{await sb.auth.signOut();login()};
 ({stock:vStock,clientes:vClientes,ventas:vVentas,compras:vCompras,ped:vPed,dinero:vDinero})[tab]();
}
function vStock(){
 const e=edit?pid(edit)||{}:{};
 $("#m").innerHTML=`<h3>${edit?"Modificar":"Alta de"} producto</h3><form id="f"><input name="nombre" placeholder="Nombre" value="${esc(e.nombre)}" required><input name="costo" type="number" step="any" placeholder="Costo" value="${e.costo??""}"><input name="precio" type="number" step="any" placeholder="Precio venta" value="${e.precio??""}" required><input name="stock" type="number" placeholder="Stock" value="${e.stock??""}"><input name="desc" placeholder="Descripción" value="${esc(e.descripcion)}"><input name="foto" type="file" accept="image/*"><button class="p">${edit?"Guardar":"Agregar"}</button>${edit?'<button type="button" id="cx">Cancelar</button>':""}</form>
 <div class="w"><table><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Visible</th><th></th></tr>${P.map(p=>`<tr><td>${esc(p.nombre)}</td><td><button data-m="${p.id}">−</button> <b>${p.stock}</b> <button data-p="${p.id}">+</button></td><td>${money(p.costo)}</td><td>${money(p.precio)}</td><td><input type="checkbox" data-v="${p.id}" ${p.visible?"checked":""}></td><td><button data-e="${p.id}">Modificar</button> <button data-d="${p.id}">Baja</button></td></tr>`).join("")}</table></div>`;
 const st=async(i,s)=>{await sb.from("productos").update({stock:Math.max(0,pid(i).stock+s)}).eq("id",i);load()};
 $$("[data-m]",b=>b.onclick=()=>st(b.dataset.m,-1));$$("[data-p]",b=>b.onclick=()=>st(b.dataset.p,1));
 $$("[data-v]",b=>b.onchange=async()=>{await sb.from("productos").update({visible:b.checked}).eq("id",b.dataset.v);load()});wire("productos");
 $("#f").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);
  const o={nombre:f.get("nombre"),costo:+f.get("costo")||0,precio:+f.get("precio")||0,stock:+f.get("stock")||0,descripcion:f.get("desc")};
  const file=f.get("foto");
  if(file&&file.size){const n=Date.now()+"-"+file.name.replace(/[^\w.]/g,"_"),u=await sb.storage.from("fotos").upload(n,file);if(u.error)return alert("Error subiendo la foto");o.foto=sb.storage.from("fotos").getPublicUrl(n).data.publicUrl}
  save("productos",edit,o)};
}
function vClientes(){
 const e=edit?C.find(c=>c.id===edit)||{}:{};
 $("#m").innerHTML=`<h3>${edit?"Modificar":"Nuevo"} cliente</h3><form id="f"><input name="n" placeholder="Nombre" value="${esc(e.nombre)}" required><input name="t" placeholder="Teléfono" value="${esc(e.tel)}"><input name="l" placeholder="Localidad" value="${esc(e.localidad)}"><button class="p">${edit?"Guardar":"Agregar"}</button>${edit?'<button type="button" id="cx">Cancelar</button>':""}</form>
 <div class="w"><table><tr><th>Nombre</th><th>Teléfono</th><th>Localidad</th><th></th></tr>${C.map(c=>`<tr><td>${esc(c.nombre)}</td><td>${esc(c.tel)}</td><td>${esc(c.localidad)}</td><td><button data-e="${c.id}">Modificar</button> <button data-d="${c.id}">Baja</button></td></tr>`).join("")}</table></div>`;
 wire("clientes");$("#f").onsubmit=e=>{e.preventDefault();const f=e.target;save("clientes",edit,{nombre:f.n.value,tel:f.t.value,localidad:f.l.value})};
}
function vVentas(){
 $("#m").innerHTML=`<h3>Nueva venta</h3><form id="f"><select name="p" required><option value="">Producto…</option>${P.map(p=>`<option value="${p.id}">${esc(p.nombre)} (stock ${p.stock})</option>`).join("")}</select><input name="c" list="cl" placeholder="Cliente" required><datalist id="cl">${C.map(c=>`<option value="${esc(c.nombre)}">`).join("")}</datalist><input name="t" placeholder="WhatsApp cliente"><input name="q" type="number" min="1" value="1" required><input name="co" type="number" step="any" placeholder="Costo unit."><input name="pr" type="number" step="any" placeholder="Precio unit." required><select name="cobra">${opt(SOCIOS)}</select><select name="m">${opt(MED)}</select><button class="p">Registrar</button></form><p class="m">Si no hay stock suficiente, se guarda como pedido en la pestaña Pedidos.</p>
 <div class="w"><table><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Total</th><th>Cobró</th><th>Medio</th><th></th></tr>${V.map(v=>`<tr><td>${fd(v.fecha)}</td><td>${esc(v.cliente)}</td><td>${v.cantidad} x ${esc(v.producto)}</td><td>${money(vt(v))}</td><td>${v.cobra}</td><td>${v.medio}</td><td><button data-i="${v.id}">Factura</button> <button data-a="${v.id}">Anular</button></td></tr>`).join("")}</table></div>`;
 const f=$("#f");f.p.onchange=()=>{const p=pid(f.p.value);if(p){f.co.value=p.costo;f.pr.value=p.precio}};
 f.c.onchange=()=>{const c=C.find(x=>x.nombre===f.c.value);if(c)f.t.value=c.tel||""};
 $$("[data-i]",b=>b.onclick=()=>factura(V.find(v=>v.id===b.dataset.i)));
 $$("[data-a]",b=>b.onclick=async()=>{const v=V.find(x=>x.id===b.dataset.a);if(!confirm("¿Anular esta venta? Se devuelve el stock."))return;const p=pid(v.producto_id);if(p)await sb.from("productos").update({stock:p.stock+v.cantidad}).eq("id",p.id);await sb.from("ventas").delete().eq("id",v.id);load()});
 f.onsubmit=async e=>{e.preventDefault();const p=pid(f.p.value),q=+f.q.value;
  if(q>p.stock){const it=[{id:p.id,nombre:p.nombre,cant:q,precio:+f.pr.value,costo:+f.co.value||0}];
   if(await save("pedidos",null,{cliente:f.c.value,tel:f.t.value,items:it,total:q*(+f.pr.value),estado:"Pendiente"})){alert("No hay stock suficiente: se guardó como pedido.");tab="ped";render()}return}
  const{data,error}=await sb.from("ventas").insert({cliente:f.c.value,tel:f.t.value,producto_id:p.id,producto:p.nombre,cantidad:q,costo:+f.co.value||0,precio:+f.pr.value,cobra:f.cobra.value,medio:f.m.value}).select().single();
  if(error)return alert("Error: "+error.message);
  await sb.from("productos").update({stock:p.stock-q}).eq("id",p.id);await load();factura(data)};
}
function factura(v){
 const txt=`ROYAL ESSENCE PARFUM\nComprobante N° ${String(v.nro).padStart(4,"0")}\nFecha: ${fd(v.fecha)}\nCliente: ${v.cliente}\n\n${v.cantidad} x ${v.producto} @ ${money(v.precio)}\nTOTAL: ${money(vt(v))}\nPago: ${v.medio} (a ${v.cobra})\n\n¡Gracias por tu compra!`;
 const d=$("#d");d.innerHTML=`<pre>${esc(txt)}</pre><a href="https://wa.me/${(v.tel||"").replace(/\D/g,"")}?text=${encodeURIComponent(txt)}" target="_blank"><button class="p">Enviar por WhatsApp</button></a> <button id="pr">Imprimir</button> <button id="cl">Cerrar</button>`;
 d.showModal();$("#cl").onclick=()=>d.close();$("#pr").onclick=()=>printDoc("<pre>"+esc(txt)+"</pre>");
}
function vCompras(){
 const e=edit?K.find(k=>k.id===edit)||{}:{};
 $("#m").innerHTML=`<h3>${edit?"Modificar":"Nueva"} compra a proveedor</h3><form id="f"><input name="pv" placeholder="Proveedor" value="${esc(e.proveedor)}" required><select name="p" required><option value="">Producto…</option>${P.map(p=>`<option value="${p.id}" ${p.id===e.producto_id?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select><input name="q" type="number" min="1" placeholder="Cantidad" value="${e.cantidad??""}" required><input name="co" type="number" step="any" placeholder="Costo unitario" value="${e.costo??""}" required><select name="pp">${opt(SOCIOS,e.pagado_por)}</select><select name="m">${opt(MED,e.medio)}</select>${edit?"":'<label><input type="checkbox" name="s" checked> Sumar al stock</label>'}<button class="p">${edit?"Guardar":"Registrar"}</button>${edit?'<button type="button" id="cx">Cancelar</button>':""}</form>
 <div class="w"><table><tr><th>Fecha</th><th>Proveedor</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Pagó</th><th>Medio</th><th></th></tr>${K.map(k=>`<tr><td>${fd(k.fecha)}</td><td>${esc(k.proveedor)}</td><td>${esc(k.producto)}</td><td>${k.cantidad}</td><td>${money(ct(k))}</td><td>${k.pagado_por}</td><td>${k.medio}</td><td><button data-e="${k.id}">Modificar</button> <button data-d="${k.id}">Baja</button></td></tr>`).join("")}</table></div><p class="m">Modificar o dar de baja una compra no cambia el stock; ajustalo en Stock si hace falta.</p>`;
 wire("compras");
 $("#f").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,p=pid(f.p.value),q=+f.q.value,co=+f.co.value;
  const o={proveedor:f.pv.value,producto_id:p.id,producto:p.nombre,cantidad:q,costo:co,pagado_por:f.pp.value,medio:f.m.value};
  if(!edit&&f.s.checked)await sb.from("productos").update({stock:p.stock+q,costo:co}).eq("id",p.id);
  save("compras",edit,o)};
}
function printDoc(h){const w=window.open("","_blank");if(!w)return alert("Permití las ventanas emergentes para imprimir");
 w.document.write(`<html><head><title>Royal Essence</title><style>body{font:14px monospace;max-width:420px;margin:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #999;padding:3px;text-align:left}pre{white-space:pre-wrap}</style></head><body>${h}<script>onload=()=>print()<\/script></body></html>`);w.document.close()}
const loc=o=>(C.find(c=>c.nombre===o.cliente||(c.tel&&c.tel===o.tel))||{}).localidad||"";
function ticket(o){return `<pre>ROYAL ESSENCE PARFUM\nPEDIDO ${o.id.slice(0,6).toUpperCase()}\nFecha: ${fd(o.fecha)}\nCliente: ${o.cliente}\nTel: ${o.tel||"-"}\nLocalidad: ${loc(o)||"-"}\n\n${o.items.map(i=>`${i.cant} x ${i.nombre} @ ${money(i.precio)}`).join("\n")}\n\nTOTAL: ${money(o.total)}\nEstado: ${o.estado}</pre>`}
function vPed(){
 const pe=O.filter(o=>o.estado==="Pendiente");
 $("#m").innerHTML=`<h3>Gestor de pedidos</h3><button class="p" id="pl">Imprimir lista completa (pendientes)</button><div style="height:10px"></div>`+(O.length?O.map(o=>`<div class="c"><b>${esc(o.cliente)}</b> · ${esc(o.tel)} · ${esc(loc(o))} <span class="m">${fd(o.fecha)} · ${o.estado}</span><br>${o.items.map(i=>`${i.cant} x ${esc(i.nombre)}`).join(", ")} — <b>${money(o.total)}</b><br>${o.estado==="Pendiente"?`<button data-s="${o.id}">Pasar a venta</button> `:`<button data-r="${o.id}">Reabrir</button> `}<button data-t="${o.id}">Ticket</button> <button data-x="${o.id}">Borrar</button></div>`).join(""):'<p class="m">Todavía no hay pedidos.</p>');
 $("#pl").onclick=()=>{const tot={};pe.forEach(o=>o.items.forEach(i=>tot[i.nombre]=(tot[i.nombre]||0)+i.cant));
  printDoc(`<h3>Pedidos pendientes · ${new Date().toLocaleDateString("es-AR")}</h3><table><tr><th>Cliente</th><th>Tel</th><th>Detalle</th><th>Total</th></tr>${pe.map(o=>`<tr><td>${esc(o.cliente)}</td><td>${esc(o.tel)}</td><td>${o.items.map(i=>i.cant+" x "+esc(i.nombre)).join(", ")}</td><td>${money(o.total)}</td></tr>`).join("")}</table><h4>Total por producto</h4>${Object.entries(tot).map(([n,c])=>`${c} x ${esc(n)}<br>`).join("")}<h4>Total: ${money(sum(pe,o=>+o.total))}</h4>`)};
 $$("[data-t]",b=>b.onclick=()=>printDoc(ticket(O.find(o=>o.id===b.dataset.t))));
 $$("[data-s]",b=>b.onclick=()=>pasar(O.find(o=>o.id===b.dataset.s)));
 $$("[data-r]",b=>b.onclick=async()=>{await sb.from("pedidos").update({estado:"Pendiente"}).eq("id",b.dataset.r);load()});
 $$("[data-x]",b=>b.onclick=()=>del("pedidos",b.dataset.x));
}
function pasar(o){const d=$("#d");
 d.innerHTML=`<h3>Pasar a venta</h3><p>${esc(o.cliente)} · ${money(o.total)}</p><form id="g" style="grid-template-columns:1fr"><select name="cobra">${opt(SOCIOS)}</select><select name="m">${opt(MED)}</select><button class="p">Confirmar</button><button type="button" id="cl">Cancelar</button></form>`;d.showModal();$("#cl").onclick=()=>d.close();
 $("#g").onsubmit=async e=>{e.preventDefault();const f=e.target;
  for(const i of o.items){const p=pid(i.id);await sb.from("ventas").insert({cliente:o.cliente,tel:o.tel,producto_id:p?p.id:null,producto:i.nombre,cantidad:i.cant,costo:i.costo??(p?p.costo:0),precio:i.precio,cobra:f.cobra.value,medio:f.m.value});if(p)await sb.from("productos").update({stock:Math.max(0,p.stock-i.cant)}).eq("id",p.id)}
  await sb.from("pedidos").update({estado:"Entregado"}).eq("id",o.id);d.close();load()}}
function vDinero(){
 const ef=s=>sum(V.filter(v=>v.cobra===s&&v.medio==="Efectivo"),vt),tr=s=>sum(V.filter(v=>v.cobra===s&&v.medio==="Transferencia"),vt);
 const dp=s=>sum(D.filter(d=>d.socio===s),d=>+d.monto),ce=s=>sum(K.filter(k=>k.pagado_por===s&&k.medio==="Efectivo"),ct);
 const saldo=sum(V.filter(v=>v.cobra==="Cuenta del negocio"),vt)+sum(D,d=>+d.monto)-sum(K.filter(k=>k.pagado_por==="Cuenta del negocio"),ct);
 $("#m").innerHTML=`<div class="c">Vendido <span class="pr">${money(sum(V,vt))}</span> · Ganancia <span class="pr">${money(sum(V,v=>v.cantidad*(v.precio-v.costo)))}</span> · Compras <span class="pr">${money(sum(K,ct))}</span> · Capital en stock <span class="pr">${money(sum(P,p=>p.stock*p.costo))}</span></div>
 <div class="c">Saldo cuenta del negocio: <span class="pr">${money(saldo)}</span><div class="m">Cobrado en la cuenta + depósitos de efectivo − compras pagadas desde la cuenta</div></div>
 <h3>Por socio</h3><div class="w"><table><tr><th></th><th>Cobró efectivo</th><th>Cobró transf.</th><th>Depositó</th><th>Pagó compras (efvo)</th><th>Efectivo por depositar</th></tr>${PERS.map(s=>`<tr><td>${s}</td><td>${money(ef(s))}</td><td>${money(tr(s))}</td><td>${money(dp(s))}</td><td>${money(ce(s))}</td><td><b>${money(ef(s)-dp(s)-ce(s))}</b></td></tr>`).join("")}</table></div>
 <h3>Depositar efectivo en la cuenta</h3><form id="f"><select name="s">${opt(PERS)}</select><input name="mo" type="number" step="any" placeholder="Monto" required><input name="n" placeholder="Nota (opcional)"><button class="p">Registrar depósito</button></form>
 <div class="w"><table><tr><th>Fecha</th><th>Socio</th><th>Monto</th><th>Nota</th><th></th></tr>${D.map(d=>`<tr><td>${fd(d.fecha)}</td><td>${d.socio}</td><td>${money(d.monto)}</td><td>${esc(d.nota)}</td><td><button data-m="${d.id}">Modificar</button> <button data-d="${d.id}">Baja</button></td></tr>`).join("")}</table></div>`;
 $("#f").onsubmit=e=>{e.preventDefault();const f=e.target;save("depositos",null,{socio:f.s.value,monto:+f.mo.value,nota:f.n.value})};
 $$("[data-d]",b=>b.onclick=()=>del("depositos",b.dataset.d));
 $$("[data-m]",b=>b.onclick=()=>{const d=D.find(x=>x.id===b.dataset.m),n=prompt("Nuevo monto",d.monto);if(n!==null&&!isNaN(+n))save("depositos",d.id,{monto:+n})});
}
</script></body></html>
