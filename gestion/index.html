
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gestión · Royal Essence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap" rel="stylesheet">
<style>
/* grilla: contenido fluido, padding 24, un solo gap de 24 */
:root{--ground:#eef1f3;--surface:#fff;--raised:#f4f6f8;--active:#e3e8eb;--border:#e3e7ea;--rule:#eff1f2;--control:#c3c8cc;--text:#131416;--muted:#5d5f60;--accent:#0d7480;--positive:#1e7b4f;--negative:#c4242a;--warning:#92400e;
--pill-pos-bg:#dcfae5;--pill-pos-ink:#04250e;--pill-neg-bg:#ffedea;--pill-neg-ink:#831c1e;--pill-warn-bg:#fffbeb;--pill-warn-ink:#92400e;--pill-neu-bg:#ebedee;--pill-neu-ink:#353736;
--gap:24px;--pad:24px;--ch:32px}
*{box-sizing:border-box;margin:0}
body{background:var(--ground);color:var(--text);font:400 14px/20px "IBM Plex Sans",system-ui,sans-serif;display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.num{font-variant-numeric:tabular-nums;text-align:right}
aside{padding:20px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:0 12px 20px}.brand b{font:600 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;color:var(--accent);display:block}.brand span{color:var(--muted);font-size:12px}
aside a{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
aside a:hover{background:var(--active)}aside a.on{background:var(--active);font-weight:500}aside a i{font-style:normal;color:var(--muted);font-size:12px}
.who{margin-top:auto;padding:12px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}.who button{margin-top:6px}
.sheet{margin:8px 8px 8px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:var(--pad);min-width:0}
.bar{display:none}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--gap);margin-bottom:var(--gap);flex-wrap:wrap}
h1{font:600 22px/28px "IBM Plex Sans",sans-serif}.sub{color:var(--muted);margin-top:2px}h3{font:600 16px/24px "IBM Plex Sans";margin:var(--gap) 0 12px}
button,select,input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--control);border-radius:6px;height:var(--ch);padding:0 10px}
button{cursor:pointer}button:hover{background:var(--raised)}button.p{background:var(--text);color:#fff;border-color:var(--text)}button.p:hover{background:#2b2d30}
button.t{border:0;background:none;padding:0 6px;text-decoration:underline;text-underline-offset:3px;height:28px}button.t:hover{background:none;color:var(--accent)}
button.d{color:var(--negative)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.on{background:var(--active);font-weight:500;position:relative}
form.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-items:end;background:var(--raised);border-radius:8px;padding:16px;margin-bottom:var(--gap)}
form.f label{display:flex;flex-direction:column;gap:6px;font-weight:500}form.f label input,form.f label select{font-weight:400;width:100%}
form.f .acts{display:flex;gap:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--border);border-radius:8px;margin-bottom:var(--gap)}
.kpi div{padding:16px var(--pad);border-left:1px solid var(--border)}.kpi div:first-child{border:0}.kpi span{color:var(--muted)}.kpi b{display:block;font:400 28px/36px "IBM Plex Sans";font-variant-numeric:tabular-nums}.kpi b.l{font-size:30px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:left;padding:0 10px 8px;white-space:nowrap}td{padding:0 10px;height:48px;border-top:1px solid var(--rule);white-space:nowrap}th.num{text-align:right}
td.wrap{white-space:normal;min-width:180px}td .m{color:var(--muted);font-size:12px;display:block}
.pill{display:inline-block;height:20px;line-height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--pill-neu-bg);color:var(--pill-neu-ink)}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}.pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink);border:1px solid #fde68a;line-height:18px}.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.thumb{width:32px;height:32px;border-radius:3px;object-fit:cover;background:var(--raised);vertical-align:middle;margin-right:12px;display:inline-block}
.empty{border:1px dashed var(--control);border-radius:8px;padding:10px 16px;color:var(--muted)}
.tool{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.tool input[type=search]{width:240px}
.lane{display:grid;grid-template-columns:140px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}.lane .tr{height:6px;background:var(--active);border-radius:3px;position:relative}.lane .tr i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:24px;width:min(92%,420px)}dialog::backdrop{background:rgba(19,20,22,.4)}pre{white-space:pre-wrap;font:13px/20px "IBM Plex Sans";margin-bottom:16px}
dialog form{display:grid;gap:12px;margin-top:12px}
.login{max-width:340px;margin:12vh auto;display:grid;gap:12px}.login b{font:600 34px/1 "Bricolage Grotesque";letter-spacing:-.04em;color:var(--accent)}
@media(max-width:800px){body{display:block}aside{position:fixed;inset:48px 0 0;height:auto;background:var(--ground);z-index:9;display:none;padding:16px}aside.open{display:flex}aside a{height:44px}
.bar{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 16px;position:sticky;top:0;background:var(--ground);z-index:10}.bar b{font:600 18px "Bricolage Grotesque";color:var(--accent)}
.sheet{margin:0 8px 8px;padding:16px}.tool input[type=search]{width:100%}.kpi div{border-left:0;border-top:1px solid var(--border)}.kpi div:first-child{border:0}.lane{grid-template-columns:1fr auto}.lane .tr{grid-column:1/-1;order:3}}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end}.lk{color:var(--accent);text-underline-offset:3px;font-size:13px}
@media(max-width:800px){.ln{grid-template-columns:1fr 1fr}}
@media print{aside,.bar,button{display:none}}
</style></head><body>
<div class="bar"><b>Royal Essence</b><button id="mn">Menú</button></div>
<aside id="side"></aside><main class="sheet" id="v"></main><dialog id="d"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://mkchtybakuwekjfycnia.supabase.co",SB_KEY="TU_ANON_KEY";
const SOCIOS=["Tiago","Joaquin","Cuenta del negocio"],PERS=["Tiago","Joaquin"],MED=["Efectivo","Transferencia"],sb=supabase.createClient(SB_URL,SB_KEY);
const REC=1.015,cst=c=>Math.round((+c||0)*REC*100)/100; /* al costo se le suma 1,5 % */
let P=[],V=[],O=[],C=[],K=[],D=[],tab="ped",edit=null,show=false,est="todos",q="",who="",ctab="cli";
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID();
const money=n=>"$"+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:0,maximumFractionDigits:2}),fd=s=>s?s.slice(0,10):"—",pid=i=>P.find(p=>p.id===i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opt=(l,s)=>l.map(x=>`<option ${x===s?"selected":""}>${x}</option>`).join("");
const sum=(l,f)=>l.reduce((s,x)=>s+f(x),0),vt=v=>v.cantidad*v.precio,ct=k=>k.cantidad*cst(k.costo),days=s=>Math.max(0,Math.floor((Date.now()-new Date(s))/864e5));
const dash='<span style="color:var(--muted)">—</span>',deb=()=>O.filter(o=>o.estado==="Entregado");
async function save(t,id,o){const r=id?await sb.from(t).update(o).eq("id",id):await sb.from(t).insert(o);if(r.error){alert("Error: "+r.error.message);return false}edit=null;show=false;await load();return true}
async function del(t,id,m){if(confirm(m||"¿Eliminar?")){await sb.from(t).delete().eq("id",id);load()}}
async function mover(items,s){const a={};items.forEach(i=>{if(i.id)a[i.id]=(a[i.id]||0)+i.cant});for(const id in a){const p=pid(id);if(p)await sb.from("productos").update({stock:Math.max(0,p.stock-s*a[id])}).eq("id",id)}}
const falta=items=>{const a={};items.forEach(i=>a[i.id]=(a[i.id]||0)+i.cant);return Object.keys(a).some(id=>a[id]>(pid(id)?.stock||0))};
(async()=>{const{data:{session}}=await sb.auth.getSession();session?start(session):login()})();
function login(msg){$("#side").innerHTML="";$(".bar").style.display="none";$("#v").style.cssText="margin:0;border:0;background:none";
 $("#v").innerHTML=`<form class="login" id="lf"><b>Royal Essence</b><span style="color:var(--muted)">Gestión · solo socios</span><input name="e" type="email" placeholder="Email" autocomplete="username" required><input name="p" type="password" placeholder="Contraseña" autocomplete="current-password" required><button class="p">Ingresar</button><span style="color:var(--negative)">${msg||""}</span></form>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});error?login("Email o contraseña incorrectos."):location.reload()}}
async function start(s){const{data:ok}=await sb.rpc("es_socio");if(!ok){await sb.auth.signOut();return login("Esta cuenta no tiene acceso.")}who=s.user.email;$(".bar").style.display="";$("#v").style.cssText="";tab=location.hash.slice(1)||"ped";await load()}
async function load(){
 const g=(t,o)=>sb.from(t).select("*").order(o,{ascending:o!=="fecha"});
 const r=await Promise.all([g("productos","nombre"),g("ventas","fecha"),g("pedidos","fecha"),g("clientes","nombre"),g("compras","fecha"),g("depositos","fecha")]);
 [P,V,O,C,K,D]=r.map(x=>x.data||[]);const bad=r.find(x=>x.error);if(bad)alert("Falta correr un SQL en Supabase: "+bad.error.message);render()}
const NAV=[["ped","Pedidos"],["ventas","Ventas"],["stock","Stock"],["compras","Compras"],["clientes","Clientes"],["dinero","Dinero"]];
function debtors(){const m={};deb().forEach(o=>{const k=(o.cliente||"").trim().toLowerCase();(m[k]=m[k]||{n:o.cliente,tel:o.tel,l:[]}).l.push(o)});return Object.values(m).map(g=>({...g,t:sum(g.l,o=>+o.total)})).sort((a,b)=>b.t-a.t)}
function render(){
 const pend=O.filter(o=>o.estado==="Pendiente").length,nd=debtors().length;
 $("#side").innerHTML=`<div class="brand"><b>Royal Essence</b><span>Perfumería · Tiago y Joaquin</span></div>`+NAV.map(n=>`<a data-act="nav" data-id="${n[0]}" class="${tab===n[0]?"on":""}">${n[1]}${n[0]==="ped"&&pend?`<i>${pend} pendientes</i>`:""}${n[0]==="clientes"&&nd?`<i>${nd} deudores</i>`:""}</a>`).join("")+`<div class="who">${esc(who)}<br><button data-act="out">Salir</button></div>`;
 $("#side").classList.remove("open");
 ({stock:vStock,clientes:vClientes,ventas:vVentas,compras:vCompras,ped:vPed,dinero:vDinero})[tab]()}
const head=(t,s,btn)=>`<div class="head"><div><h1>${t}</h1><div class="sub">${s}</div></div>${btn||""}</div>`;
const addbtn=l=>`<button class="p" data-act="new">${l}</button>`;
const formacts=l=>`<div class="acts"><button class="p">${edit?"Guardar":l}</button>${edit||show?'<button type="button" data-act="cx">Cancelar</button>':""}</div>`;
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,o=O.find(x=>x.id===id);
 if(a==="nav"){tab=id;edit=null;show=false;location.hash=id;render()}
 else if(a==="out"){await sb.auth.signOut();location.reload()}
 else if(a==="new"){show=true;edit=null;render();scrollTo(0,0)}
 else if(a==="cx"){edit=null;show=false;render()}
 else if(a==="edit"){edit=id;render();scrollTo(0,0)}
 else if(a==="del")del({stock:"productos",clientes:"clientes",compras:"compras",dinero:"depositos",ped:"pedidos"}[tab],id,tab==="stock"?"¿Dar de baja este producto?":"¿Eliminar?")
 else if(a==="st"){const p=pid(id);await sb.from("productos").update({stock:Math.max(0,p.stock+ +b.dataset.n)}).eq("id",id);load()}
 else if(a==="addl"){$("#lines").insertAdjacentHTML("beforeend",lineHTML($("#lines").dataset.m))}
 else if(a==="rml"){if(document.querySelectorAll(".ln").length>1)b.closest(".ln").remove()}
 else if(a==="fac")factura(gV().find(g=>(g[0].grupo||g[0].id)===id))
 else if(a==="anular")anular(id)
 else if(a==="tk")printDoc(ticket(o))
 else if(a==="ent"){if(falta(o.items)&&!confirm("Falta stock de algún perfume. ¿Entregar igual?"))return;dlgPed(o,"ent")}
 else if(a==="pagar")dlgPed(o,"pag")
 else if(a==="reab"){if(!confirm("El pedido vuelve a Pendiente y se devuelve el stock. ¿Seguir?"))return;await mover(o.items,-1);await sb.from("pedidos").update({estado:"Pendiente",entregado_en:null}).eq("id",id);load()}
 else if(a==="anpago"){if(!confirm("Se anula el pago: sale de ventas y del dinero, y el pedido vuelve a Entregado. ¿Seguir?"))return;await sb.from("ventas").delete().eq("grupo",id);await sb.from("pedidos").update({estado:"Entregado",pagado_en:null,cobra:null,medio:null}).eq("id",id);load()}
 else if(a==="est"){est=id;vPed()}
 else if(a==="ctab"){ctab=id;render()}
 else if(a==="plist")printList()
 else if(a==="dmonto"){const d=D.find(x=>x.id===id),n=prompt("Nuevo monto",d.monto);if(n!==null&&!isNaN(+n)&&n!=="")save("depositos",id,{monto:+n})}});
$("#mn").onclick=()=>$("#side").classList.toggle("open");
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.vis){await sb.from("productos").update({visible:t.checked}).eq("id",t.dataset.vis);load()}
 else if(t.name==="cobra"&&t.form&&t.form.m){const m=t.form.m,c=t.value==="Cuenta del negocio";if(c)m.value="Transferencia";[...m.options].forEach(o=>o.disabled=c&&o.value==="Efectivo")}
 else if(t.name==="p"&&t.closest(".ln")){const ln=t.closest(".ln"),p=pid(t.value),v=ln.parentElement.dataset.m==="v";if(p){ln.querySelector("[name=co]").value=v?cst(p.costo):p.costo;if(v)ln.querySelector("[name=pr]").value=p.precio}}});
function lineHTML(m,l={}){const v=m==="v";return `<div class="ln"><label>Perfume<select name="p" required><option value="">Elegir…</option>${P.map(p=>`<option value="${p.id}" ${p.id===l.p?"selected":""}>${esc(p.nombre)}${v?` (stock ${p.stock})`:""}</option>`).join("")}</select></label><label>Cantidad<input name="q" type="number" min="1" value="${l.q??1}" required></label><label>${v?"Costo unit.":"Precio proveedor unit."}<input name="co" type="number" step="any" value="${l.co??""}" required></label>${v?`<label>Precio unit.<input name="pr" type="number" step="any" required></label>`:""}<button type="button" class="t d" data-act="rml">Quitar</button></div>`}
const readLines=f=>[...f.querySelectorAll(".ln")].map(l=>({p:pid(l.querySelector("[name=p]").value),q:+l.querySelector("[name=q]").value,co:+l.querySelector("[name=co]").value||0,pr:+(l.querySelector("[name=pr]")||{}).value||0})).filter(x=>x.p);
function vStock(){
 const e=edit?pid(edit)||{}:{},open=show||edit,low=P.filter(p=>p.stock===0).length;
 $("#v").innerHTML=head("Stock",`${P.length} perfumes · ${low} sin stock · capital en stock ${money(sum(P,p=>p.stock*cst(p.costo)))}`,addbtn("Nuevo perfume"))+
 (open?`<form class="f" id="f"><label>Nombre<input name="nombre" value="${esc(e.nombre)}" required></label><label>Costo del proveedor<input name="costo" type="number" step="any" value="${e.costo??""}"></label><label>Precio de venta<input name="precio" type="number" step="any" value="${e.precio??""}" required></label><label>Stock<input name="stock" type="number" value="${e.stock??""}"></label><label>Descripción<input name="desc" value="${esc(e.descripcion)}"></label><label>Foto<input name="foto" type="file" accept="image/*" style="padding:4px"></label>${formacts("Agregar")}</form><p class="sub" style="margin:-8px 0 var(--gap)">Al costo se le suma 1,5 % automáticamente.</p>`:"")+
 (P.length?`<div class="w"><table><tr><th>Perfume</th><th class="num">Stock</th><th class="num">Costo +1,5 %</th><th class="num">Precio</th><th>En catálogo</th><th></th></tr>${P.map(p=>`<tr><td>${p.foto?`<img class="thumb" src="${esc(p.foto)}" alt="">`:'<span class="thumb"></span>'}${esc(p.nombre)}${p.stock===0?' <span class="pill warn">Sin stock</span>':""}</td><td class="num"><button class="t" data-act="st" data-n="-1" data-id="${p.id}" aria-label="Restar">−</button> <b>${p.stock}</b> <button class="t" data-act="st" data-n="1" data-id="${p.id}" aria-label="Sumar">+</button></td><td class="num">${money(cst(p.costo))}</td><td class="num">${money(p.precio)}</td><td><input type="checkbox" data-vis="${p.id}" ${p.visible?"checked":""} style="height:auto" aria-label="Visible en catálogo"></td><td><button class="t" data-act="edit" data-id="${p.id}">Modificar</button><button class="t d" data-act="del" data-id="${p.id}">Baja</button></td></tr>`).join("")}</table></div>`:'<div class="empty">Todavía no cargaste perfumes.</div>');
 const f=$("#f");if(f)f.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.target);
  const o={nombre:d.get("nombre"),costo:+d.get("costo")||0,precio:+d.get("precio")||0,stock:+d.get("stock")||0,descripcion:d.get("desc")},file=d.get("foto");
  if(file&&file.size){const n=Date.now()+"-"+file.name.replace(/[^\w.]/g,"_"),u=await sb.storage.from("fotos").upload(n,file);if(u.error)return alert("Error subiendo la foto");o.foto=sb.storage.from("fotos").getPublicUrl(n).data.publicUrl}
  save("productos",edit,o)}}
function vClientes(){
 const e=edit?C.find(c=>c.id===edit)||{}:{},open=(show||edit)&&ctab==="cli",ds=debtors(),tot=sum(ds,g=>g.t);
 const seg=`<div class="tool"><div class="seg"><button data-act="ctab" data-id="cli" class="${ctab==="cli"?"on":""}">Clientes</button><button data-act="ctab" data-id="deu" class="${ctab==="deu"?"on":""}">Deudores${ds.length?" ("+ds.length+")":""}</button></div></div>`;
 const sub=`${C.length} clientes · ${ds.length?`${ds.length} deben ${money(tot)}`:"nadie debe nada"}`;
 if(ctab==="deu"){
  $("#v").innerHTML=head("Clientes",sub)+seg+`<div class="kpi"><div><span>Total adeudado</span><b class="l">${money(tot)}</b></div><div><span>Deudores</span><b>${ds.length}</b></div><div><span>Deuda más antigua</span><b>${ds.length?days(Math.min(...deb().map(o=>new Date(o.entregado_en||o.fecha))))+" días":"—"}</b></div></div>`+
